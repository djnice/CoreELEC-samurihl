# R_volution PlayerPro 8K: TM1628 on GPIOT_0 (dat), GPIOT_1 (clk), GPIOT_2 (stb).
# Common anode panel with free segment lines (flags 0x03), grids a-g. Six
# digits (HH:MM:SS on SEG2, SEG10, SEG8, SEG3, SEG5, SEG4); the clock uses the
# first four, the colon between them is grid 6 of SEG7.
vfd_gpio_clk='0,71,0'
vfd_gpio_dat='0,70,0'
vfd_gpio_stb='0,72,0'
vfd_chars='6,1,9,7,2'
vfd_dot_bits='2,2,2,2,6,4,5'
vfd_display_type='0x00,0x00,0x03,0x00'
