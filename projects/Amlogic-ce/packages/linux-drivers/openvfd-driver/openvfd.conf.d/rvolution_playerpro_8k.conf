# R_volution PlayerPro 8K: TM1628 on GPIOT_0 (dat), GPIOT_1 (clk), GPIOT_2 (stb).
# Common anode panel with free segment lines (flags 0x03), grids a-g. Six digits
# (HH:MM:SS on SEG2, SEG10, SEG8, SEG3, SEG5, SEG4). The clock uses the layout of
# the vendor firmware for "t[HH:MM]": hours on SEG8, SEG3, minutes on SEG5, SEG4,
# the colon between them is grid 3 of SEG6.
vfd_gpio_clk='0,71,0'
vfd_gpio_dat='0,70,0'
vfd_gpio_stb='0,72,0'
vfd_chars='5,7,2,4,3'
vfd_dot_bits='2,2,2,2,2,2,2'
vfd_display_type='0x00,0x00,0x03,0x00'
