# Dune HD Pro 8K Plus: TM1628 on GPIOT_0 (dat), GPIOT_1 (clk), GPIOT_2 (stb).
# Common anode panel (transposed): grid n = segment n of display type 0x0B,
# the segment lines select the digits. Four digits on SEG7, SEG8, SEG6, SEG4
# (chars 1, 0, 2, 4), the colon is grid 5 on SEG3 (char 5).
vfd_gpio_clk='0,71,0'
vfd_gpio_dat='0,70,0'
vfd_gpio_stb='0,72,0'
vfd_chars='5,1,0,2,4'
vfd_dot_bits='1,1,1,1,5,4,6'
vfd_display_type='0x0B,0x00,0x01,0x00'
